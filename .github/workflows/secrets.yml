name: Secrets Demo

on:
  pull_request:
    branches: ["main"]

jobs:
  secret_job:
    runs-on: ubuntu-latest

    steps:
      - name: Test secret
        env:
          MY_SECRET: ${{ secrets.SUPERSECRET }}
        run: |
          if [ -n "$MY_SECRET" ]; then
            echo "Secret accessed successfully!"
          else
            echo "Secret not found!"
            exit 1
          fi
