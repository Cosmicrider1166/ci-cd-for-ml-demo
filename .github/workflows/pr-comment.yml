name: PR Comment

on:
  pull_request:
    branches: ["main"]

permissions:
  pull-requests: write

jobs:
  comment_job:
    runs-on: ubuntu-latest

    steps:
      - name: Comment PR
        uses: thollander/actions-comment-pull-request@v3
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          message: |
            Hello world! :wave:
            This comment was automatically generated by GitHub Actions.
